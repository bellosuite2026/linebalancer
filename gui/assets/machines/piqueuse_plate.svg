<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Piqueuse plate (single needle lockstitch) -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#cbd5e0"/>
      <stop offset="100%" style="stop-color:#a0aec0"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#2b6cb0"/>
    </linearGradient>
  </defs>
  
  <!-- Base/Table -->
  <rect x="4" y="48" width="56" height="8" rx="2" fill="url(#darkGrad)"/>
  <rect x="8" y="50" width="48" height="4" rx="1" fill="#1a202c"/>
  
  <!-- Machine body -->
  <path d="M12 16 L52 16 L50 42 L14 42 Z" fill="url(#metalGrad)" stroke="#718096" stroke-width="1.5"/>
  <path d="M14 18 L48 18 L46 40 L16 40 Z" fill="#edf2f7" stroke="#cbd5e0" stroke-width="0.5"/>
  
  <!-- Arm -->
  <path d="M46 18 L58 18 L56 30 L48 30 Z" fill="url(#metalGrad)" stroke="#718096" stroke-width="1.5"/>
  <path d="M48 20 L56 20 L54 28 L50 28 Z" fill="#edf2f7" stroke="#cbd5e0" stroke-width="0.5"/>
  
  <!-- Handwheel -->
  <circle cx="56" cy="24" r="10" fill="#1a202c" stroke="#4a5568" stroke-width="2"/>
  <circle cx="56" cy="24" r="6" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <circle cx="56" cy="24" r="2" fill="#4299e1"/>
  <g stroke="#4a5568" stroke-width="1.5" stroke-linecap="round">
    <line x1="56" y1="16" x2="56" y2="20"/>
    <line x1="56" y1="28" x2="56" y2="32"/>
    <line x1="48" y1="24" x2="52" y2="24"/>
    <line x1="60" y1="24" x2="64" y2="24"/>
    <line x1="50.5" y1="17.5" x2="53" y2="20"/>
    <line x1="61.5" y1="17.5" x2="59" y2="20"/>
    <line x1="61.5" y1="30.5" x2="59" y2="28"/>
    <line x1="50.5" y1="30.5" x2="53" y2="28"/>
  </g>
  
  <!-- Needle bar -->
  <rect x="44" y="20" width="4" height="30" rx="1" fill="#cbd5e0" stroke="#a0aec0" stroke-width="1"/>
  <rect x="43" y="44" width="6" height="3" rx="1" fill="#718096"/>
  <line x1="46" y1="45" x2="46" y2="50" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="50" r="1.5" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="0.5"/>
  
  <!-- Presser foot -->
  <path d="M40 38 L48 38 L46 44 L42 44 Z" fill="#a0aec0" stroke="#718096" stroke-width="1"/>
  
  <!-- Feed dogs -->
  <g fill="#4a5568" stroke="#2d3748" stroke-width="0.5">
    <rect x="34" y="42.5" width="2" height="2" rx="0.5"/>
    <rect x="37" y="42.5" width="2" height="2" rx="0.5"/>
    <rect x="40" y="42.5" width="2" height="2" rx="0.5"/>
    <rect x="43" y="42.5" width="2" height="2" rx="0.5"/>
    <rect x="46" y="42.5" width="2" height="2" rx="0.5"/>
    <rect x="49" y="42.5" width="2" height="2" rx="0.5"/>
  </g>
  
  <!-- Bobbin case area -->
  <rect x="30" y="38" width="20" height="10" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <ellipse cx="40" cy="43" rx="6" ry="3" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  
  <!-- Tension assembly -->
  <rect x="14" y="10" width="8" height="30" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <g fill="#e2e8f0">
    <circle cx="18" cy="16" r="3"/>
    <circle cx="18" cy="24" r="3"/>
    <circle cx="18" cy="32" r="3"/>
  </g>
  <g stroke="#4299e1" stroke-width="1.5" stroke-linecap="round">
    <line x1="18" y1="19" x2="18" y2="21"/>
    <line x1="18" y1="27" x2="18" y2="29"/>
    <line x1="18" y1="35" x2="18" y2="37"/>
  </g>
  
  <!-- Thread guide -->
  <path d="M18 10 L18 8 Q22 6 26 8 L26 12" stroke="#cbd5e0" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Reverse lever -->
  <path d="M20 38 L20 50 L18 52 L16 50 L16 38 Z" fill="#e53e3e" stroke="#c53030" stroke-width="1"/>
  
  <!-- Stitch length dial -->
  <circle cx="58" cy="42" r="8" fill="#1a202c" stroke="#4a5568" stroke-width="2"/>
  <circle cx="58" cy="42" r="4" fill="#2d3748"/>
  <g stroke="#63b3ed" stroke-width="2" stroke-linecap="round">
    <line x1="58" y1="38" x2="58" y2="34"/>
    <line x1="58" y1="46" x2="58" y2="50"/>
    <line x1="54" y1="42" x2="50" y2="42"/>
    <line x1="62" y1="42" x2="66" y2="42"/>
  </g>
  <text x="58" y="45" font-family="monospace" font-size="6" font-weight="bold" fill="#63b3ed" text-anchor="middle">mm</text>
  
  <!-- Brand -->
  <rect x="16" y="42" width="28" height="10" rx="2" fill="#1a365d" opacity="0.9"/>
  <text x="30" y="49" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#63b3ed" text-anchor="middle">JUKI</text>
  <text x="30" y="55" font-family="monospace" font-size="5" fill="#4299e1" text-anchor="middle">DDL-9000</text>
  
  <!-- Stitch selector -->
  <rect x="50" y="10" width="12" height="18" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <g font-family="monospace" font-size="6" font-weight="bold" fill="#63b3ed" text-anchor="middle">
    <text x="56" y="16">0</text>
    <text x="56" y="22">●</text>
    <text x="56" y="28">2</text>
  </g>
</svg>